[package]
name = "notes-peer"
version = "0.1.0"
edition = "2021"
description = "Identity, keys, and live sync shared by the desktop app and the headless Claude peer."

[dependencies]
dirs = "5"
notes-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
base64 = "0.22"
zeroize = "1"
gethostname = "0.5"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
automerge = "0.12"
tempfile = "3"
