[package]
name = "notes-core"
version = "0.1.0"
edition = "2021"

[dependencies]
automerge = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
