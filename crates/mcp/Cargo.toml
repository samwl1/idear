[package]
name = "idear-mcp"
version = "1.0.0"
edition = "2021"
description = "Claude's own peer for idear: joins shared workspaces and serves them over MCP."

[lib]
name = "idear_mcp"
path = "src/lib.rs"

[[bin]]
name = "idear-mcp"
path = "src/main.rs"

[dependencies]
notes-core = { path = "../core" }
notes-peer = { path = "../peer" }
automerge = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
dirs = "5"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "io-std", "io-util", "net"] }

[dev-dependencies]
tempfile = "3"
iroh = "1.3"
