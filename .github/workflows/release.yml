# Builds the desktop app and attaches it to a GitHub release.
#
# Cut a release by pushing a version tag:
#   git tag v1.1.0 && git push origin v1.1.0
# The tag must match the version in src-tauri/tauri.conf.json (and package.json,
# src-tauri/Cargo.toml). "Run workflow" on the Actions tab builds the current
# branch into a draft release instead, for trying a build without tagging.
#
# macOS builds are signed and notarized when the APPLE_* secrets are set (an
# Apple Developer account); without them they're unsigned and Gatekeeper makes
# people clear the quarantine flag once (see the release notes).
name: Release

on:
  push:
    # Version tags only (v1.2.3, v1.2.3-beta.1), not anything that starts with a v.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# Read-only by default; only the build job, which creates the release, can write.
permissions:
  contents: read

jobs:
  # Nothing is built or published unless the tests pass and the tag matches
  # the version the app will report.
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          conf="v$(jq -r .version src-tauri/tauri.conf.json)"
          pkg="v$(jq -r .version package.json)"
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for v in "$conf" "$pkg" "$crate"; do
            if [ "$v" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the version files (tauri.conf.json $conf, package.json $pkg, Cargo.toml $crate)."
              exit 1
            fi
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev build-essential \
            libssl-dev librsvg2-dev libgtk-3-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev build-essential \
            libssl-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev patchelf

      - run: npm ci

      # Optional macOS signing. The variables are only set when the secrets
      # exist: Tauri takes an empty APPLE_CERTIFICATE as a certificate to
      # import, and fails the build.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No signing certificate: building unsigned."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done

      # The install notes say what this build is: notarized only when the
      # signing secrets are set. Every job in the matrix writes the same text,
      # whichever one creates the release.
      - name: Release notes
        shell: bash
        env:
          NOTARIZED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
        run: |
          if [ "$NOTARIZED" = "true" ]; then
            mac="Signed and notarized, so it opens like any other app."
          else
            mac="The build isn't notarized yet, so the first launch needs one extra step: right-click the app, choose **Open**, and confirm. If macOS says the app is damaged instead, run \`xattr -cr /Applications/idear.app\` once in Terminal, then open it normally."
          fi
          {
            echo "RELEASE_BODY<<IDEAR_EOF"
            echo "## Install"
            echo
            echo "**macOS** (Apple Silicon and Intel, one download): open the \`.dmg\` and drag idear to Applications. $mac"
            echo
            echo "**Linux**: the \`.AppImage\` runs anywhere (\`chmod +x\` it first); the \`.deb\` is for Debian and Ubuntu, the \`.rpm\` for Fedora. Live sync and device linking keep your keys in the system keyring, so a running Secret Service (GNOME Keyring or KWallet) is needed."
            echo
            echo "**Windows**: not yet."
            echo
            echo "Your data lives in your own app folder and syncs only between your own devices and the people you invite. See the [docs](https://github.com/samwl1/idear/tree/main/docs) for sharing, update files, and connecting Claude."
            echo "IDEAR_EOF"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'untagged-build' }}
          releaseName: ${{ github.ref_type == 'tag' && format('idear {0}', github.ref_name) || 'Untagged build' }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: ${{ github.ref_type != 'tag' }}
          # v1.2.3-beta.1 and the like are marked as pre-releases.
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
