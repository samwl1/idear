[package]
name = "idear"
version = "1.0.0"
edition = "2021"

[lib]
name = "idear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "../crates/core" }
notes-peer = { path = "../crates/peer" }
idear-mcp = { path = "../crates/mcp" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
base64 = "0.22"
zeroize = "1"
tauri-plugin-opener = "2"
gethostname = "0.5"
dirs = "5"
tauri-plugin-dialog = "2"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Spell check lives in the WebKitGTK context; macOS gets it from WebKit itself.
webkit2gtk = { version = "2", features = ["v2_40"] }

[dev-dependencies]
automerge = "0.12"
tempfile = "3"
